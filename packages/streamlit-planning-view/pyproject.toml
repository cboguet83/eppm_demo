[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-planning-view"
version = "0.2.0"
description = "Independent Streamlit adapter for the planning-view browser component"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = ["streamlit>=1.63,<2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
streamlit_planning_view = ["frontend/**/*", "frontend/index.html", "frontend/manifest.json"]
