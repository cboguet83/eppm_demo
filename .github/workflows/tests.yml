name: Application and PostgreSQL checks

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    eppm-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'metadata' || 'acceptance' }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      lane: ${{ steps.plan.outputs.lane }}
      context: ${{ steps.plan.outputs.context }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Classify complete diff and audit test inventory
        id: plan
        run: python -m scripts.pr_test_policy plan --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"

  feedback:
    needs: policy
    if: needs.policy.outputs.lane == 'feedback'
    name: fast draft feedback
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.receipt.outputs.sha }}
      decision_digest: ${{ steps.receipt.outputs.decision_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install ordinary development dependencies
        run: |
          python -m scripts.build_planning_assets
          python -m pip install -e '.[dev]'
      - name: Partial Python and component feedback
        run: |
          python -m scripts.run_tests fast
          node --test tests/test_*.cjs
          node --test packages/planning-view/tests/*.test.js
          python -m scripts.build_planning_assets --check
      - name: Record successful feedback identity
        id: receipt
        env:
          EPPM_TEST_DECISION: ${{ needs.policy.outputs.decision }}
        run: python -m scripts.pr_test_policy attest

  full:
    needs: policy
    if: needs.policy.outputs.lane == 'full' || needs.policy.outputs.lane == 'manual'
    name: full suite and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.receipt.outputs.sha }}
      decision_digest: ${{ steps.receipt.outputs.decision_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install application and browser test tools
        run: |
          python -m scripts.build_planning_assets
          python -m pip install 'setuptools>=80' wheel
          python -m pip install -e '.[dev,browser-tests]'
          python -m playwright install --with-deps chromium
      - name: Create isolated PostgreSQL credentials and database service
        run: |
          python -m scripts.configure_postgresql
          docker compose --project-name eppm-tests --env-file .local/postgresql.env -f docker-compose.postgresql.yml -f docker-compose.postgresql-test.yml up -d --wait postgres
          python -m scripts.postgresql_admin --env-file .local/postgresql.env --url-variable POSTGRES_TEST_ADMIN_URL provision
      - name: Build isolated authenticated browser application
        run: docker build -t eppm-demo:local .
      - name: Python, Streamlit, PostgreSQL and authenticated browser checks
        env:
          EPPM_RUN_OIDC_E2E: '1'
          EPPM_BENCHMARK_BROWSER: /usr/bin/google-chrome
          POSTGRES_TEST_CLIENT_CONTAINER: eppm-tests-postgres-1
        run: python -m dotenv -f .local/postgresql.env run -- python -m scripts.run_tests full
      - name: Record successful full acceptance identity
        id: receipt
        env:
          EPPM_TEST_DECISION: ${{ needs.policy.outputs.decision }}
        run: python -m scripts.pr_test_policy attest
      - name: Stop isolated database service
        if: always()
        run: |
          if test -f .local/postgresql.env
          then
            docker compose --project-name eppm-tests --env-file .local/postgresql.env -f docker-compose.postgresql.yml -f docker-compose.postgresql-test.yml down --volumes
          fi

  tests:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual acceptance' || needs.policy.outputs.context || 'tests' }}
    needs: [policy, full, feedback]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Require complete current acceptance
        env:
          EPPM_TEST_NEEDS: ${{ toJSON(needs) }}
        run: python -m scripts.pr_test_policy gate
