# PostgreSQL storage stays independent of application lifecycle and old archives.
# Standalone server: docker compose --env-file .local/postgresql.env -f docker-compose.postgresql.yml up -d
services:
  postgres:
    ports:
      - "127.0.0.1:5434:5432"
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: eppm_operator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts.configure_postgresql first}
      POSTGRES_DB: eppm
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ["postgres", "-c", "max_connections=100"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eppm_operator -d eppm"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - postgresql-data:/var/lib/postgresql
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eppm_pgadmin
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  # Keep your existing volume definitions
  
  postgresql-data:
  