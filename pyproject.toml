[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eppm-demo"
version = "0.1.0"
description = "EPPM Streamlit demo with a layered architecture"
requires-python = ">=3.14,<3.15"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "pytest-xdist>=3.8,<4", "setuptools>=80", "wheel"]
browser-tests = ["playwright==1.62.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["presentation/assets/components/*/*.html", "presentation/assets/components/gantt/*.js", "presentation/assets/components/gantt/*.css", "presentation/assets/components/gantt/planning-view/**/*", "presentation/assets/locales/*.json", "presentation/assets/*.js", "presentation/assets/*.css", "infrastructure/postgresql/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
exclude_also = ["^\\s*\\.\\.\\.$", "if __name__ == [\"']__main__[\"']:"]
