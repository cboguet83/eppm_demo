services:
  app:
    image: ${EPPM_APP_IMAGE:-eppm-demo:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "-m", "scripts.run_app"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Configure the restricted PostgreSQL runtime URL}
      - DATABASE_CONTEXT_KEY=${DATABASE_CONTEXT_KEY:?Configure the PostgreSQL request signing key}
      - DATABASE_POOL_MIN=${DATABASE_POOL_MIN:-2}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-20}
      - DATABASE_ACQUIRE_TIMEOUT=${DATABASE_ACQUIRE_TIMEOUT:-5}
      - DATABASE_STATEMENT_TIMEOUT=${DATABASE_STATEMENT_TIMEOUT:-10}
      - DATABASE_BACKUP_DIRECTORY=/app/data/backups/postgresql
      - LOG_LEVEL=INFO
      - APP_ENV=${APP_ENV:-production}
      - APP_RUN_MODE=${APP_RUN_MODE:-auto}
      - APP_FILE_WATCHER_TYPE=${APP_FILE_WATCHER_TYPE:-}
      - APP_ORIGIN=${APP_ORIGIN:?Configure the application origin}
      - APP_COOKIE_SECRET=${APP_COOKIE_SECRET:?Configure a random cookie secret}
      - OIDC_ISSUER=${OIDC_ISSUER:?Configure the exact provider issuer}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:?Configure the registered client ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:?Configure the client secret}
      - OIDC_ALLOW_LOCAL_HTTP=${OIDC_ALLOW_LOCAL_HTTP:-false}
      - OIDC_SIGNING_ALGORITHMS=${OIDC_SIGNING_ALGORITHMS:-RS256}
      - OIDC_MFA_ACR_VALUES=${OIDC_MFA_ACR_VALUES:-}
      - SESSION_IDLE_SECONDS=${SESSION_IDLE_SECONDS:-900}
      - SESSION_REAUTHENTICATION_SECONDS=${SESSION_REAUTHENTICATION_SECONDS:-300}
    volumes:
      # Retain existing archives and store explicit operator backups separately.
      - ${EPPM_DATA_DIRECTORY:-./data}:/app/data
      # Development bind mounts: Streamlit hot-reloads application changes
      # without rebuilding the image. Dependencies remain image-managed.
      - ./streamlit_app.py:/app/streamlit_app.py:ro
      - ./asgi_app.py:/app/asgi_app.py:ro
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./.streamlit:/app/.streamlit:ro
