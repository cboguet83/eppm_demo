services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppm-studio-pro
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DB_NAME=/app/data/ppm_mock.db
      - LOG_LEVEL=INFO
      - APP_ENV=${APP_ENV:-development}
      - FORCE_RESEED=${FORCE_RESEED:-false}
      - SEED_PROJECTS_COUNT=${SEED_PROJECTS_COUNT:-0}
    volumes:
      # Persist the development SQLite database directly in the project folder.
      - ./data:/app/data
      # Development bind mounts: Streamlit hot-reloads application changes
      # without rebuilding the image. Dependencies remain image-managed.
      - ./streamlit_app.py:/app/streamlit_app.py:ro
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./.streamlit:/app/.streamlit:ro
